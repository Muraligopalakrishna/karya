<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karya</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/logo.svg" alt="" class="logo" width="30" height="30">
      <h1>Karya</h1>
      <span class="dot" id="conn-dot" title="Connected to Karya on this PC" aria-hidden="true"></span>
    </div>
    <div class="actions">
      <button type="button" id="ai-pill" class="pill" title="The AI Karya thinks with. Click to change it."><span id="provider-label">connecting...</span></button>
      <button type="button" id="setup-btn" class="ghost">Setup</button>
      <button type="button" id="new-chat" class="ghost">New chat</button>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden>
    Karya has no AI to think with yet. <button type="button" id="notice-btn" class="link">Connect one in Setup</button>
  </div>

  <div id="setup-panel" class="overlay" role="dialog" aria-modal="true" aria-label="Setup" hidden></div>
  <div id="guide" class="overlay" role="dialog" aria-modal="true" aria-label="Welcome to Karya" hidden></div>

  <main id="chat" class="chat" aria-live="polite" aria-label="Conversation">
    <div id="welcome" class="welcome">
      <img src="/static/logo.svg" alt="" class="welcome-logo" width="64" height="64">
      <h2>What should I do for you?</h2>
      <p>Ask in plain words. Karya does the work on this PC and asks you before it sends, posts, submits or pays.</p>
      <div class="ideas" role="list">
        <button type="button" class="idea" role="listitem" data-prompt="Find product manager jobs in Bengaluru that fit my resume and apply to the best 3"><span class="idea-kind">Jobs</span><span class="idea-text">Find product manager jobs in Bengaluru that fit my resume and apply to the best 3</span></button>
        <button type="button" class="idea" role="listitem" data-prompt="Research the best budget laptops for coding this year and give me a short list with prices"><span class="idea-kind">Research</span><span class="idea-text">Research the best budget laptops for coding this year and give me a short list with prices</span></button>
        <button type="button" class="idea" role="listitem" data-prompt="What are traders saying about Nifty today? Show the mood and the levels they mention"><span class="idea-kind">Markets</span><span class="idea-text">What are traders saying about Nifty today? Show the mood and the levels they mention</span></button>
        <button type="button" class="idea" role="listitem" data-prompt="Make a bot called Maya that checks new PM jobs every morning at 9 and applies"><span class="idea-kind">Bots</span><span class="idea-text">Make a bot called Maya that checks new PM jobs every morning at 9 and applies</span></button>
        <button type="button" class="idea" role="listitem" data-prompt="Write a LinkedIn post about my latest project and open it ready to post"><span class="idea-kind">Social</span><span class="idea-text">Write a LinkedIn post about my latest project and open it ready to post</span></button>
        <button type="button" class="idea" role="listitem" data-prompt="Check my PC's health and tell me what is slowing it down"><span class="idea-kind">PC</span><span class="idea-text">Check my PC's health and tell me what is slowing it down</span></button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div id="status-line" class="status-line" role="status"></div>
    <form id="chat-form" autocomplete="off">
      <label for="input" class="sr-only">Message Karya</label>
      <textarea id="input" rows="1" placeholder="Ask Karya to do anything..."></textarea>
      <button type="button" id="stop-btn" class="danger" hidden>Stop</button>
      <button type="submit" id="send-btn">Send</button>
    </form>
    <div class="composer-options">
      <label class="toggle" title="On: Karya runs everyday actions (commands, file edits, uploads) without asking. It always asks before sending, posting, applying, paying, deleting or publishing.">
        <input type="checkbox" id="auto-mode"><span>Ask only for big actions</span>
      </label>
      <label class="toggle" title="On: Karya works until the task is done, without stopping to ask &quot;shall I continue?&quot;. Sending, posting, applying and paying still need your OK.">
        <input type="checkbox" id="keep-going"><span>Keep going until done</span>
      </label>
      <span class="composer-hint">Enter sends, Shift+Enter adds a line. @Name gives a task to one of your bots.</span>
    </div>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
