<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Karya Browser Link</title>
  <style>
    body { font: 13px/1.45 system-ui, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 12px; color: #1f1f1f; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .status { padding: 8px; border-radius: 6px; background: #f1f3f4; margin-bottom: 10px; }
    .status.ok { background: #e6f4ea; color: #137333; }
    .status.bad { background: #fce8e6; color: #a50e0e; }
    button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #5b4bdb; background: #5b4bdb; color: #fff; cursor: pointer; }
    button.ghost { background: #fff; color: #5b4bdb; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    label { display: block; margin-top: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 5px; border: 1px solid #9aa0a6; border-radius: 4px; font: inherit; }
    p { margin: 6px 0; color: #444; }
    details { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Karya Browser Link</h1>
  <div id="status" class="status" role="status" aria-live="polite">Checking...</div>
  <div class="row">
    <button type="button" id="adopt">Let Karya use this tab</button>
    <button type="button" id="reconnect" class="ghost">Reconnect</button>
  </div>
  <p>Karya works only in its own tabs (the purple "Karya" group). Posting, sending and submitting still need your approval in Karya's chat.</p>
  <details>
    <summary>Connection settings</summary>
    <p>Filled in automatically when Karya starts. Only change these if Karya runs on another port.</p>
    <label for="port">Port</label>
    <input id="port" inputmode="numeric" autocomplete="off">
    <label for="token">Pairing token (the token= part of Karya's chat link)</label>
    <input id="token" type="password" autocomplete="off">
    <div class="row"><button type="button" id="save">Save</button></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
